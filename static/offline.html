<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>VTIC | Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #0b2a52;
        background: #f7faff;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        width: min(100%, 480px);
        padding: 40px;
        text-align: center;
        background: #fff;
        border: 1px solid #dce7f5;
        border-radius: 20px;
        box-shadow: 0 18px 50px rgba(18, 55, 100, 0.1);
      }
      img {
        width: 150px;
        max-height: 72px;
        object-fit: contain;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
      }
      p {
        color: #5c718c;
      }
      button {
        margin-top: 14px;
        padding: 13px 22px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #0865ed;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/static/images/vtic-logo.png" alt="VTIC" />
      <h1>You’re offline</h1>
      <p>
        Reconnect to continue browsing live products, messages, and review
        requests.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
