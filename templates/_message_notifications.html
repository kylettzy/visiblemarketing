<link rel="stylesheet" href="{{ url_for('static', filename='css/message_notifications.css') }}" />
<div class="message-notifications" data-message-notifications data-csrf-token="{{ csrf_token }}" data-target="{{ '/account/reviews' if session.customer_id else '/admin/messages' }}">
  <a href="{{ '/account/reviews' if session.customer_id else '/admin/messages' }}" aria-label="Open message notifications">
    <span aria-hidden="true">✦</span><em>Messages</em><b data-message-notification-count hidden>0</b>
  </a>
</div>
<script src="{{ url_for('static', filename='js/message-notifications.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/live-updates.js') }}" defer></script>
